<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mein Krypto Portfolio (CHF)</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; }
    h1 { color: #10b981; margin-bottom: 24px; }
    .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2); }
    .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
    .stat-card { background: #1e293b; padding: 15px; border-radius: 10px; border-left: 4px solid #10b981; }
    .stat-card h4 { margin: 0; color: #94a3b8; font-size: 13px; text-transform: uppercase; }
    .stat-card .val { font-size: 20px; font-weight: bold; margin-top: 5px; }
    .form-group { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; position: relative; }
    .search-container { position: relative; flex: 1; min-width: 200px; }
    input { background: #334155; border: 1px solid #475569; color: #fff; padding: 10px 14px; border-radius: 6px; width: 100%; box-sizing: border-box; font-size: 14px; }
    input[type="date"] { color-scheme: dark; }
    input:focus { outline: 2px solid #10b981; border-color: transparent; }
    
    /* Live-Suchergebnisse Styling */
    .search-results { position: absolute; top: 100%; left: 0; right: 0; background: #1e293b; border: 1px solid #475569; border-radius: 6px; max-height: 200px; overflow-y: auto; z-index: 1000; display: none; margin-top: 4px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5); }
    .search-item { padding: 10px 14px; cursor: pointer; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; font-size: 14px; }
    .search-item:hover { background: #334155; color: #10b981; }
    .search-item .symbol { color: #94a3b8; font-size: 12px; }

    button { background: #10b981; color: #fff; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #059669; }
    .table-container { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { text-align: left; padding: 12px; border-bottom: 1px solid #334155; }
    th { color: #94a3b8; font-weight: 600; }
    .positive { color: #34d399; font-weight: bold; }
    .negative { color: #f87171; font-weight: bold; }
    .delete-btn { background: #ef4444; padding: 4px 8px; font-size: 12px; }
    .delete-btn:hover { background: #dc2626; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Krypto Portfolio Tracker</h1>

    <div class="summary-grid">
      <div class="stat-card">
        <h4>Gesamtwert</h4>
        <div class="val" id="totalValue">0.00 CHF</div>
      </div>
      <div class="stat-card">
        <h4>Gesamt Investiert</h4>
        <div class="val" id="totalInvested">0.00 CHF</div>
      </div>
      <div class="stat-card">
        <h4>Gewinn / Verlust</h4>
        <div class="val" id="totalProfitLoss">0.00 CHF</div>
      </div>
    </div>

    <div class="card">
      <h3>Kauf hinzufügen</h3>
      <div class="form-group">
        
        <div class="search-container">
          <input type="text" id="coinSearch" placeholder="Coin suchen (z.B. Kaspa, Bitcoin)..." autocomplete="off" oninput="searchCoins()">
          <input type="hidden" id="selectedCoinId">
          <div id="searchResults" class="search-results"></div>
        </div>

        <input type="number" step="any" id="amount" placeholder="Menge (z.B. 0.0063)">
        <input type="number" step="any" id="totalBuyPrice" placeholder="Gesamt-Kaufpreis (z.B. 507.45 CHF)">
        <input type="date" id="buyDate">
        <button onclick="addAsset()">Speichern</button>
      </div>
    </div>

    <div class="card">
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Datum</th>
              <th>Asset</th>
              <th>Menge</th>
              <th>Gesamt Investiert</th>
              <th>Kaufpreis / Coin (berechnet)</th>
              <th>Aktueller Kurs</th>
              <th>Aktueller Wert</th>
              <th>Gewinn / Verlust</th>
              <th>Aktion</th>
            </tr>
          </thead>
          <tbody id="portfolioTable"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // Supabase Konfiguration
    const SUPABASE_URL = 'https://pymmoavninjluycfjlur.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB5bW1vYXZuaW5qbHV5Y2ZqbHVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0NDEwODAsImV4cCI6MjEwNDAxNzA4MH0.H9D9gthYNSV-cfFQTd6i9lqo3Pol-XhCWRY18pPcjSs';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    document.getElementById('buyDate').valueAsDate = new Date();

    let searchTimeout = null;

    // Dynamische Live-Suche über CoinGecko API
    function searchCoins() {
      const query = document.getElementById('coinSearch').value.trim();
      const resultsDiv = document.getElementById('searchResults');

      clearTimeout(searchTimeout);

      if (query.length < 2) {
        resultsDiv.style.display = 'none';
        return;
      }

      // Verzögerung (Debounce), um API-Anfragen zu begrenzen
      searchTimeout = setTimeout(async () => {
        try {
          const res = await fetch(`https://api.coingecko.com/api/v3/search?query=${encodeURIComponent(query)}`);
          const data = await res.json();
          
          resultsDiv.innerHTML = '';
          if (data.coins && data.coins.length > 0) {
            data.coins.slice(0, 8).forEach(coin => {
              const item = document.createElement('div');
              item.className = 'search-item';
              item.innerHTML = `<span><b>${coin.name}</b></span> <span class="symbol">${coin.symbol.toUpperCase()} (${coin.id})</span>`;
              item.onclick = () => selectCoin(coin.id, coin.name, coin.symbol);
              resultsDiv.appendChild(item);
            });
            resultsDiv.style.display = 'block';
          } else {
            resultsDiv.style.display = 'none';
          }
        } catch (e) {
          console.error("Fehler bei der Live-Suche:", e);
        }
      }, 300);
    }

    function selectCoin(id, name, symbol) {
      document.getElementById('coinSearch').value = `${name} (${symbol.toUpperCase()})`;
      document.getElementById('selectedCoinId').value = id;
      document.getElementById('searchResults').style.display = 'none';
    }

    // Klick außerhalb schließt die Suchergebnisse
    document.addEventListener('click', function(e) {
      if (!e.target.closest('.search-container')) {
        document.getElementById('searchResults').style.display = 'none';
      }
    });

    async function addAsset() {
      // Wenn eine Option gewählt wurde, nimm die ID, sonst die direkte Manuelleingabe
      let coin_id = document.getElementById('selectedCoinId').value;
      if (!coin_id) {
        coin_id = document.getElementById('coinSearch').value.toLowerCase().trim();
      }

      const amount = parseFloat(document.getElementById('amount').value);
      const total_buy_price = parseFloat(document.getElementById('totalBuyPrice').value);
      const buy_date = document.getElementById('buyDate').value;

      if (!coin_id || isNaN(amount) || isNaN(total_buy_price) || !buy_date) {
        alert('Bitte wähle einen Coin aus und fülle alle Felder korrekt aus.');
        return;
      }

      const buy_price = total_buy_price / amount;

      const { error } = await _supabase
        .from('portfolio')
        .insert([{ coin_id, amount, buy_price, total_buy_price, buy_date }]);

      if (error) {
        console.error("Fehler beim Speichern:", error);
        alert("Fehler beim Speichern in Supabase.");
      } else {
        document.getElementById('coinSearch').value = '';
        document.getElementById('selectedCoinId').value = '';
        document.getElementById('amount').value = '';
        document.getElementById('totalBuyPrice').value = '';
        document.getElementById('buyDate').valueAsDate = new Date();
        loadPortfolio();
      }
    }

    async function deleteAsset(id) {
      const { error } = await _supabase
        .from('portfolio')
        .delete()
        .eq('id', id);

      if (error) {
        console.error("Fehler beim Löschen:", error);
      } else {
        loadPortfolio();
      }
    }

    async function loadPortfolio() {
      const { data: portfolio, error } = await _supabase
        .from('portfolio')
        .select('*')
        .order('buy_date', { ascending: false });
      
      const tableBody = document.getElementById('portfolioTable');
      
      if (error) {
        console.error("Fehler beim Laden:", error);
        tableBody.innerHTML = '<tr><td colspan="9">Fehler beim Laden aus Supabase.</td></tr>';
        return;
      }

      if (!portfolio || portfolio.length === 0) {
        tableBody.innerHTML = '<tr><td colspan="9">Noch keine Positionen eingetragen.</td></tr>';
        document.getElementById('totalValue').innerText = '0.00 CHF';
        document.getElementById('totalInvested').innerText = '0.00 CHF';
        document.getElementById('totalProfitLoss').innerText = '0.00 CHF';
        return;
      }

      const ids = [...new Set(portfolio.map(item => item.coin_id))].join(',');
      
      let prices = {};
      try {
        const response = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=chf`);
        prices = await response.json();
      } catch (e) {
        console.error("Fehler beim Abrufen der Kurse:", e);
      }

      let totalCurrentValueSum = 0;
      let totalInvestedSum = 0;
      tableBody.innerHTML = '';

      portfolio.forEach((item) => {
        const currentPrice = prices[item.coin_id]?.chf || 0;
        
        const investedTotal = item.total_buy_price ? parseFloat(item.total_buy_price) : (item.buy_price * item.amount);
        const buyPricePerCoin = item.amount > 0 ? (investedTotal / item.amount) : 0;
        
        const currentValue = currentPrice * item.amount;
        const profitLoss = currentValue - investedTotal;
        const profitLossPercent = investedTotal > 0 ? (profitLoss / investedTotal) * 100 : 0;

        totalCurrentValueSum += currentValue;
        totalInvestedSum += investedTotal;

        const formattedDate = item.buy_date ? new Date(item.buy_date).toLocaleDateString('de-CH') : '-';

        tableBody.innerHTML += `
          <tr>
            <td>${formattedDate}</td>
            <td><b>${item.coin_id.toUpperCase()}</b></td>
            <td>${item.amount}</td>
            <td><b>${investedTotal.toFixed(2)} CHF</b></td>
            <td>${buyPricePerCoin.toFixed(2)} CHF</td>
            <td>${currentPrice ? currentPrice.toFixed(2) + ' CHF' : 'N/A'}</td>
            <td>${currentValue.toFixed(2)} CHF</td>
            <td class="${profitLoss >= 0 ? 'positive' : 'negative'}">
              ${profitLoss >= 0 ? '+' : ''}${profitLoss.toFixed(2)} CHF (${profitLossPercent.toFixed(2)}%)
            </td>
            <td>
              <button class="delete-btn" onclick="deleteAsset('${item.id}')">Löschen</button>
            </td>
          </tr>
        `;
      });

      const totalProfitLoss = totalCurrentValueSum - totalInvestedSum;
      const totalProfitLossPercent = totalInvestedSum > 0 ? (totalProfitLoss / totalInvestedSum) * 100 : 0;

      document.getElementById('totalValue').innerText = `${totalCurrentValueSum.toFixed(2)} CHF`;
      document.getElementById('totalInvested').innerText = `${totalInvestedSum.toFixed(2)} CHF`;
      
      const profitLossElem = document.getElementById('totalProfitLoss');
      profitLossElem.innerText = `${totalProfitLoss >= 0 ? '+' : ''}${totalProfitLoss.toFixed(2)} CHF (${totalProfitLossPercent.toFixed(2)}%)`;
      profitLossElem.className = `val ${totalProfitLoss >= 0 ? 'positive' : 'negative'}`;
    }

    loadPortfolio();
  </script>
</body>
</html>
